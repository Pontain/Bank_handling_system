<header>
  <div class="container">
    <nav class="text-primary">
      <a href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='assets/images/logo.jpg') }}"
             alt="bank logo"
             class="nav-logo">
      </a>

      <ul>
        {% if current_user.is_authenticated %}

          {# ADMIN: admin-sidor #}
          {% if current_user.has_role("ADMIN") %}
            <li>
              <a href="{{ url_for('admin.get_all_staff') }}">Admin</a>
            </li>
          {% endif %}

          {# CASHIER eller ADMIN: customers #}
          {% if current_user.has_role("CASHIER") %}
            <li>
              <a href="{{ url_for('customer.get_all') }}">Customers</a>
            </li>
          {% endif %}

          <li>
            <a class="btn btn-primary"
               href="{{ url_for('security.logout') }}">
              Logout
            </a>
          </li>

        {% else %}

          <li>
            <a class="btn btn-primary"
               href="{{ url_for('security.login') }}">
              Login
            </a>
          </li>

        {% endif %}
      </ul>
    </nav>
  </div>
</header>
